server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: pgsi-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/pgsi_db
    username: postgres
    password: "1234"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

pgsi:
  app:
    jwtSecret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    jwtExpirationMs: 86400000 # 24 hours
