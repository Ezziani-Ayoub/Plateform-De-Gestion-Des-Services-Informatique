version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pgsi-postgres
    environment:
      POSTGRES_DB: pgsi_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
